name: takas_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.18.0
  firebase_core: ^4.14.0
  image_picker: ^1.2.3
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 🎯 GÜNCEL İKON PAKET SÜRÜMÜ
  flutter_launcher_icons: ^0.14.0

# 🌍 YENİ STANDART GREEN-TECH İKON YAPILANDIRMASI
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  
  # 📸 İkon ve görsellerin okunması için assets yapısı kilitlendi
  assets:
    - assets/
